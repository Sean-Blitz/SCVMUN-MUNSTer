# nginx for the SCVMUN web container: TLS, the Vite build output, and the /api proxy.
#
# Included from the base image's nginx.conf inside `http{}`, so `limit_req_zone` is valid
# here. The rate limits, the 429 JSON body and the 12m upload cap are the same decisions as
# deploy/nginx/ for the bare-metal install - only the proxy target changed (127.0.0.1
# became the `api` service).
#
# The certificate is NOT baked into this image and never lives in this repository. It is
# mounted read-only from the host at /etc/nginx/tls/ with two fixed names:
#
#     fullchain.pem   the leaf certificate followed by its intermediate(s)
#     privkey.pem     the matching private key
#
# See deploy/TLS.md for how to build those two files from the certificate you were issued,
# and for the permissions they need.

# --- rate limits -------------------------------------------------------------
# One bucket per client IP. 10m of shared memory holds roughly 160k addresses.
# Keyed on the address nginx sees, which is the real client: nothing terminates TLS in
# front of this container. If you ever put Cloudflare (or another proxy) in front, add the
# provider's real-IP module first or every request shares one bucket.

# Everything under /api/: generous, it only has to stop a runaway loop.
limit_req_zone $binary_remote_addr zone=scvmun_general:10m rate=60r/m;

# Login and register: the endpoints worth brute-forcing, and the ones that run Argon2.
limit_req_zone $binary_remote_addr zone=scvmun_auth:10m rate=10r/m;

# Paper uploads: each one can cost 10 MB on disk, so a slow trickle is the point.
limit_req_zone $binary_remote_addr zone=scvmun_upload:10m rate=6r/m;

# 429, not nginx's default 503: "slow down" is a different message from "server broken".
limit_req_status 429;
limit_req_log_level warn;

# --- upstream ----------------------------------------------------------------
# Docker's embedded DNS. The variable in proxy_pass is what makes nginx re-resolve the
# `api` container per request: with a literal hostname nginx resolves it once at startup
# and keeps that IP, so recreating the api container (a normal deploy) leaves nginx
# proxying to an address that no longer exists - every request 502s until nginx reloads.
resolver 127.0.0.11 valid=10s ipv6=off;


# =============================================================================
# Port 80: the health probe and the redirect. No application content is served here.
# =============================================================================
server {
    listen 80;
    # `_` rather than the hostname: which hostname works is decided by the certificate
    # that gets mounted, not by this file. That is what lets one image serve any
    # deployment without a rebuild.
    server_name _;

    # The container healthcheck probes this exact path, and it is never redirected, so a
    # probe never has to follow a redirect to a hostname it cannot verify.
    # See the HEALTHCHECK in Frontend/Dockerfile.
    location = /healthz-web {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# =============================================================================
# Port 443: the application.
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # The certificate is RSA, so TLS 1.2 needs ECDHE suites for forward secrecy; TLS 1.3
    # negotiates its own. TLS 1.0/1.1 are deliberately absent - deprecated, and no browser
    # that can run this SPA needs them.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # Tickets off: with no server-side key rotation they weaken forward secrecy.
    ssl_session_tickets off;

    # One year, deliberately without includeSubDomains: this host is a subdomain of a
    # domain somebody else controls, and that flag would force HTTPS on their siblings.
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    # JSON only, by default. The upload location lifts this.
    client_max_body_size 1m;

    # nginx-generated 429s get a JSON body: the frontend reads
    # error.response.data.message and would otherwise toast "Server Error (429)".
    error_page 429 = @too_many_requests;

    location @too_many_requests {
        internal;
        default_type application/json;
        return 429 '{"message":"Too many requests. Please slow down and try again shortly."}';
    }

    # Compression for the asset types the build actually emits.
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Headers for every proxied location below, set on the server so the three locations
    # cannot drift apart. X-Forwarded-For is what the API reads for the client IP.
    set $api_upstream http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- paper upload: the one route allowed a large body ----
    location = /api/delegate/upload-paper {
        # 12m against the app's own 10 MB limit in core/storage.py (PAPER_MAX_MB), so the
        # app still gets to answer with its own 413 instead of nginx's HTML page.
        client_max_body_size 12m;
        limit_req zone=scvmun_upload burst=2 nodelay;

        proxy_pass $api_upstream;
    }

    # ---- auth: the endpoints worth brute-forcing ----
    location /api/auth/ {
        limit_req zone=scvmun_auth burst=5 nodelay;

        proxy_pass $api_upstream;
    }

    # ---- everything else under /api ----
    location /api/ {
        limit_req zone=scvmun_general burst=30 nodelay;

        proxy_pass $api_upstream;
    }

    # ---- the SPA ----
    # Vite emits hashed filenames, so assets can be cached hard. `expires` writes its own
    # Cache-Control and, unlike `add_header`, does not stop the inherited HSTS header from
    # being sent.
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # index.html must never be cached: it is what points at the new hashed assets.
    # A location with its own `add_header` stops inheriting the server-level ones, so HSTS
    # is repeated here rather than silently dropped on the response that matters most.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
