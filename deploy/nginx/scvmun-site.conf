# SCVMUN Platform - nginx site.
#
# Install (Ubuntu):
#   sudo cp deploy/nginx/scvmun-zones.conf  /etc/nginx/scvmun-zones.conf
#   sudo cp deploy/nginx/scvmun-site.conf   /etc/nginx/sites-available/scvmun
#   sudo ln -s /etc/nginx/sites-available/scvmun /etc/nginx/sites-enabled/scvmun
#   # then add to /etc/nginx/nginx.conf inside http{}:
#   #   include /etc/nginx/scvmun-zones.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace every <PLACEHOLDER>, and keep uvicorn bound to loopback:
#   uvicorn main:app --host 127.0.0.1 --port 8000 \
#       --proxy-headers --forwarded-allow-ips=127.0.0.1
# Without --proxy-headers every request looks like it came from 127.0.0.1, and any
# per-IP decision in the app would silently become one global bucket.

server {
    listen 80;
    server_name <DOMAIN>;

    # Everything but the ACME challenge goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name <DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;

    # JSON only, by default. The upload location lifts this (see below).
    client_max_body_size 1m;

    # nginx-generated 429s get a JSON body: the frontend reads error.response.data.message
    # and would otherwise show "Server Error (429)" instead of a useful toast.
    error_page 429 = @too_many_requests;

    location @too_many_requests {
        internal;
        default_type application/json;
        return 429 '{"message":"Too many requests. Please slow down and try again shortly."}';
    }

    # ---- the SPA (Vite build output) ----
    root /srv/scvmun/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- paper upload: the one route allowed a large body ----
    location = /api/delegate/upload-paper {
        # 12m, against the app's own 10 MB paper limit in core/storage.py (PAPER_MAX_MB).
        client_max_body_size 12m;
        limit_req zone=scvmun_upload burst=2 nodelay;

        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/scvmun-proxy.conf;
    }

    # ---- auth: the endpoints worth brute-forcing ----
    location /api/auth/ {
        limit_req zone=scvmun_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/scvmun-proxy.conf;
    }

    # ---- everything else under /api ----
    location /api/ {
        limit_req zone=scvmun_general burst=30 nodelay;

        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/scvmun-proxy.conf;
    }
}
