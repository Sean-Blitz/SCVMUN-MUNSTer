# Rate-limit buckets for the SCVMUN API.
#
# This file goes in the **http{}** block, not in a server block - limit_req_zone is only
# valid there. On Ubuntu, including it from nginx.conf is the tidy way:
#
#     include /etc/nginx/scvmun-zones.conf;
#
# Keyed on $binary_remote_addr, i.e. one bucket per client IP. Behind a load balancer or
# CDN add the provider's real-IP module first, or every request will share one bucket.
#
# 10m of shared memory holds roughly 160k addresses, far more than a conference needs.

# Everything under /api/: generous, it only has to stop a runaway loop.
limit_req_zone $binary_remote_addr zone=scvmun_general:10m rate=60r/m;

# Login and register: the endpoints worth brute-forcing, and the ones that run Argon2.
limit_req_zone $binary_remote_addr zone=scvmun_auth:10m rate=10r/m;

# Paper uploads: each one can cost 10 MB on disk, so a slow trickle is the point.
limit_req_zone $binary_remote_addr zone=scvmun_upload:10m rate=6r/m;

# 429, not nginx's default 503: "slow down" is a different message from "server broken".
limit_req_status 429;

# Log throttled requests at warn so they are visible without flooding the error log.
limit_req_log_level warn;
