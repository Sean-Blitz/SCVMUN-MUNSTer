# Shared headers for the proxied /api locations. Install to
# /etc/nginx/snippets/scvmun-proxy.conf and include it from each location that proxies
# to uvicorn, so the headers are defined once.
#
# X-Forwarded-For is what makes the client IP visible to the app; uvicorn must be started
# with --proxy-headers --forwarded-allow-ips=127.0.0.1 to trust it.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
