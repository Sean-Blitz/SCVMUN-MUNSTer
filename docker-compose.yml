# Development stack for trying the API against a real Postgres.
#
#   docker compose up -d --build
#   docker compose exec api python -m crud.bootstrap --admin-name "You" --schools /schools.json
#   curl -s localhost:8001/healthz
#
# Reaching the API: the port is published on 127.0.0.1 only, so nothing is exposed to the
# network while you test.
#
# For production the container talks to a bare-metal Postgres instead of the `postgres`
# service - see deploy/README.md for that command and the pg_hba line it needs.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: scvmun
      POSTGRES_PASSWORD: devpassword
    ports:
      # 5433 on the host so a native Postgres on 5432 does not clash.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scvmun"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./Backend
    depends_on:
      postgres:
        condition: service_healthy
    # Turnstile keys and any local overrides come from the same ignored file the native
    # dev server uses. DATABASE_URL is overridden below to point at the postgres service,
    # because the value in that file points at the host.
    env_file:
      - ./Backend/crud/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:devpassword@postgres:5432/scvmun
      # The proxy here is the host's docker gateway, so uvicorn trusts forwarded headers
      # from it; 127.0.0.1 would make every request look like one client.
      FORWARDED_ALLOW_IPS: 172.17.0.1
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - scvmun-data:/data
      # Optional: mount a schools file to bootstrap from, e.g. ./deploy/schools.example.json
      # - ./deploy/schools.example.json:/schools.json:ro
    restart: unless-stopped

volumes:
  pgdata:
  scvmun-data:
